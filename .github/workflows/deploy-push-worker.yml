name: Deploy push worker (Cloudflare)

# Deploys push/worker.js to your Cloudflare account from GitHub's runners.
# Needs two repo secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  — an "Edit Cloudflare Workers" API token
#   VAPID_PRIVATE_KEY     — the push private key
# It creates the KV storage + 5-minute cron automatically. Runs when push/
# changes or when triggered manually; no-ops safely until the token is set.

on:
  workflow_dispatch:
    inputs:
      vapid_subject:
        description: "mailto: address for VAPID (optional)"
        required: false
        default: "mailto:pathwaycareersoz@gmail.com"
  push:
    branches: [claude/health-tracking-tool-gkyw0x, main]
    paths:
      - "push/**"
      - ".github/workflows/deploy-push-worker.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check for token secret
        id: guard
        env:
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF" ]; then
            echo "No CLOUDFLARE_API_TOKEN secret yet — skipping deploy (add it, then re-run)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install wrangler
        if: steps.guard.outputs.skip == 'false'
        run: npm i -g wrangler@4

      - name: Deploy worker
        if: steps.guard.outputs.skip == 'false'
        working-directory: push
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ github.event.inputs.vapid_subject || 'mailto:pathwaycareersoz@gmail.com' }}
        run: |
          set -euo pipefail
          CF_API=https://api.cloudflare.com/client/v4
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          ACCT=$(curl -s "$CF_API/accounts" -H "$AUTH" | jq -r '.result[0].id')
          echo "Account: $ACCT"

          KVID=$(curl -s "$CF_API/accounts/$ACCT/storage/kv/namespaces?per_page=100" -H "$AUTH" | jq -r '.result[]|select(.title=="pdm-subs")|.id' | head -n1)
          if [ -z "$KVID" ] || [ "$KVID" = "null" ]; then
            KVID=$(curl -s -X POST "$CF_API/accounts/$ACCT/storage/kv/namespaces" -H "$AUTH" -H "content-type: application/json" --data '{"title":"pdm-subs"}' | jq -r '.result.id')
            echo "Created KV namespace pdm-subs: $KVID"
          else
            echo "Reusing KV namespace pdm-subs: $KVID"
          fi

          SUB=$(curl -s "$CF_API/accounts/$ACCT/workers/subdomain" -H "$AUTH" | jq -r '.result.subdomain')
          if [ -z "$SUB" ] || [ "$SUB" = "null" ]; then SUB="pathwaycareersoz"; fi

          {
            echo 'name = "pdm-push"'
            echo 'main = "worker.js"'
            echo "account_id = \"$ACCT\""
            echo 'compatibility_date = "2024-11-01"'
            echo 'workers_dev = true'
            echo '[[kv_namespaces]]'
            echo 'binding = "SUBS"'
            echo "id = \"$KVID\""
            echo '[triggers]'
            echo 'crons = ["*/5 * * * *"]'
            echo '[vars]'
            echo 'VAPID_PUBLIC_KEY = "BGh4usUdWqtdCv0iTzsFI0EkpJQPV6n5me-bTyoYvw72Xj_F0ePOfamqggpSSQL3WplR8zb_cXQPVcMRfB3I2vI"'
            echo "VAPID_SUBJECT = \"$VAPID_SUBJECT\""
          } > wrangler.toml
          echo "--- generated wrangler.toml ---"; cat wrangler.toml

          wrangler deploy
          printf '%s' "$VAPID_PRIVATE_KEY" | wrangler secret put VAPID_PRIVATE_KEY

          URL="https://pdm-push.$SUB.workers.dev"
          echo "Deployed: $URL"
          {
            echo "### ✅ Push worker deployed"
            echo ""
            echo "**Worker URL:** \`$URL\`"
            echo ""
            echo "Give this URL to Claude to wire into the app (PUSH_ENDPOINT)."
          } >> "$GITHUB_STEP_SUMMARY"
